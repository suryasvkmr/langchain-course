[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "suryasvkmr", email = "suryasivakumar013@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "langchain>=1.3.14",
    "langchain-gemini>=0.1.1",
    "langchain-google-genai>=4.3.2",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
